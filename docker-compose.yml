services:
  cheat-clip-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheat-clip-pro
    restart: unless-stopped
    ports:
      # Loopback only: the API has no user authentication.
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CHEAT_CLIP_API_KEY=${CHEAT_CLIP_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPADATA_API_KEYS=${SUPADATA_API_KEYS:-}
      - WEBSHARE_PROXY=${WEBSHARE_PROXY:-}
    volumes:
      # Paths the backend actually writes to (backend/video_engine.py); uploads live in temp_clips/uploads.
      - media_temp:/app/backend/temp_clips
      - media_exports:/app/backend/exports
      - custom_fonts:/app/backend/fonts
    deploy:
      resources:
        limits:
          memory: 3200M

volumes:
  media_temp:
  media_exports:
  custom_fonts:
